<html lang="vi">
<head>

<title>IQ∞ — Thử thách giải đố</title>
<style>
:root{--bg:#041126;--cyan:#00c8ff;--text:#eaf6ff;--muted:#9db8d8;--red:#ff496b;--green:#21dfb0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#102e60 0%,var(--bg) 60%);color:var(--text);font-family:system-ui,Arial,sans-serif}
body{min-height:100dvh}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.screen{min-height:100dvh;width:100%;display:none;align-items:center;justify-content:center;padding:clamp(10px,3vw,30px)}
.screen.active{display:flex}
.shell{width:min(100%,900px);margin:auto}
.home-card{min-height:calc(100dvh - 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(20px,5vw,56px);border:1px solid #1767c8;border-radius:28px;background:linear-gradient(155deg,#09234bde,#030d20f5);box-shadow:0 0 40px #006dff22}
.logo{font-size:clamp(4rem,15vw,8rem);line-height:1;font-weight:950;letter-spacing:-.07em;color:#e8fbff;text-shadow:0 0 8px #00d9ff,0 0 28px #008cff,0 0 60px #006eff;margin:0}
.subtitle{letter-spacing:.18em;color:#56ddff;font-size:clamp(.75rem,2.3vw,1rem);margin:16px 0 42px}
.primary,.secondary{border:0;border-radius:18px;padding:15px 26px;font-weight:850;color:white;background:linear-gradient(120deg,#138cff,#0751e9);box-shadow:0 0 24px #087bff66}
.primary{font-size:clamp(1.1rem,4vw,1.5rem);min-width:min(100%,280px)}
.home-note{color:var(--muted);margin-top:26px;max-width:440px;line-height:1.6}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.small-btn{border:1px solid #176bd0;background:#0a2347;color:#e7f6ff;border-radius:12px;padding:10px 13px;font-weight:750}
.brand{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:950;color:#dffaff;text-shadow:0 0 15px #00bfff}
.stats{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border:1px solid #175bb3;border-radius:16px;background:#071b37;margin-bottom:14px;font-weight:750}
.lives{color:#ff5a80;letter-spacing:2px;white-space:nowrap}
.progress{color:#8fdfff}
.question-card{border:1px solid #087cff;border-radius:22px;background:linear-gradient(145deg,#061b3a,#06132b);padding:clamp(18px,4vw,30px);min-height:130px;display:flex;align-items:center;justify-content:center;text-align:center;margin-bottom:16px;box-shadow:0 0 20px #006dff12}
.category{color:#5ddfff;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-bottom:12px}
.question{font-size:clamp(1.05rem,3.1vw,1.65rem);line-height:1.55;font-weight:750;overflow-wrap:anywhere}
.answers{display:grid;gap:10px}
.answer{width:100%;display:flex;align-items:center;gap:14px;text-align:left;color:var(--text);padding:clamp(12px,2.6vw,18px);border:1.5px solid #087bff;border-radius:18px;background:linear-gradient(100deg,#082951,#061a36);min-height:58px;font-size:clamp(.95rem,2.7vw,1.15rem)}
.letter{flex:0 0 40px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:950;background:linear-gradient(140deg,#12cfff,#0062ed)}
.answer.e{border-color:#8b42ff;background:linear-gradient(100deg,#271052,#11173d)}
.answer.e .letter{background:linear-gradient(140deg,#c45bff,#7134e8)}
.answer.correct{border-color:var(--green);background:#063b3a}
.answer.wrong{border-color:var(--red);background:#42162a}
.feedback{display:none;margin-top:14px;padding:14px 16px;border-radius:14px;background:#071c37;border:1px solid #2c628d;line-height:1.5}
.feedback.show{display:block}
.feedback.good{border-color:var(--green);color:#8fffe0}
.feedback.bad{border-color:var(--red);color:#ffd1dc}
.next-row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.next-btn{display:none}
.modal-backdrop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#000b;z-index:10}
.modal-backdrop.show{display:flex}
.modal{width:min(100%,560px);padding:clamp(20px,5vw,34px);border:1.5px solid #148bff;border-radius:26px;background:linear-gradient(145deg,#0b2451,#050d22);box-shadow:0 0 50px #006dff55;text-align:center}
.question-mark{font-size:3rem;color:#c7a2ff;text-shadow:0 0 22px #934cff}
.modal h2{margin:4px 0 10px}
.modal p{color:#c8ddf7;line-height:1.5}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.choice{padding:18px 10px;border-radius:20px;color:white;font-weight:850;border:2px solid}
.choice strong{display:block;font-size:1.5rem;margin-bottom:7px;color:#c58aff;text-shadow:0 0 12px #9b4dff88}
.choice small{display:block;line-height:1.4;font-weight:500;margin-top:8px}
.reset-choice{background:#4b1028;border-color:#ff496b}
.skip-choice{background:#06483f;border-color:#21dfb0}
.result-title{font-size:clamp(2rem,7vw,3.5rem);color:#5ce4ff}
